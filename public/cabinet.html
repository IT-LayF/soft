<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет Infinyty</title><link rel="stylesheet" href="/app.css"></head><body><div class="dashboard"><aside class="side"><div class="brand">INFINYTY <span>ID</span></div><p class="muted" id="who"></p><p><a href="/">Главная</a></p><p><a href="/admin" id="adminLink" style="display:none">Админ-панель</a></p><button class="ghost" onclick="logout()">Выйти</button></aside><main class="main"><div class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</div><h1>Ваш аккаунт</h1><div class="grid"><section class="card"><h3>Профиль</h3><label>Ник Minecraft<input id="nickname"></label><button onclick="saveNick()">Сохранить</button></section><section class="card"><h3>Подписка</h3><p class="muted">Активируйте ключ в лаунчере. Он привяжется к вашему компьютеру при первом запуске.</p><a class="btn" href="/#plans">Купить доступ</a></section><section class="card"><h3>Лаунчер</h3><p class="muted">Всегда скачивайте актуальную версию.</p><a class="btn" href="/">Скачать</a></section><section class="card"><h3>Мои ключи</h3><div id="licenses" class="muted">Ключей пока нет</div></section></div></main></div><script>const t=localStorage.getItem('token');if(!t)location='/';async function api(b){const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+t},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.message);return j}async function init(){try{const j=await api({action:'profile'});who.textContent='@'+j.user.login;nickname.value=j.user.nickname;if(j.user.admin)adminLink.style.display='block';licenses.innerHTML=(j.licenses||[]).length?(j.licenses.map(x=>'<p><b>'+x.key+'</b><br><small>'+((x.durationDays==null)?'Навсегда':x.durationDays+' дней')+(x.expiresAt?' · до '+new Date(x.expiresAt).toLocaleDateString():'')+'</small></p>').join('')):'Ключей пока нет'}catch{logout()}}async function saveNick(){try{await api({action:'nickname',nickname:nickname.value});alert('Ник сохранён')}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('token');location='/'}init()</script></body></html>
